[project]
name = "fourier-sound-lab-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
ml = [
    "huggingface-hub>=2.4,<3",
    "joblib>=1.5,<2",
    "librosa>=1.0,<2",
    "matplotlib>=3,<4",
    "numpy>=2.5,<3",
    "pyyaml>=6,<7",
    "safetensors>=0.4,<1",
    "scikit-learn>=1.9,<2",
    "soundfile>=0.14",
    "tensorboard>=2,<3",
    "torch>=2.15,<2.16",
    "transformers>=5.22,<6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
