[project]
name = "fourier-sound-lab"
version = "0.1.0"
description = "Как ИИ слышит мир: ряды и преобразование Фурье для анализа и классификации звука"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "librosa>=1.0,<2",
    "soundfile>=0.14",
    "imageio-ffmpeg>=0.8",
]

[project.optional-dependencies]
ml = [
    "torch>=2.15,<2.16",
    "transformers>=5.22,<6",
    "huggingface-hub>=2.4,<3",
    "scikit-learn>=1.9,<2",
]

[dependency-groups]
dev = ["pytest>=9.2"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
